# ==========================================================================
#  secret.example.yaml · MOLDE do Secret - nao preencha ESTE arquivo
#  --------------------------------------------------------------------------
#  Este arquivo e versionado e serve so de referencia do que precisa existir.
#  O Secret de verdade NAO vai para o git (o .env tambem nunca foi).
#
#  Crie-o direto no cluster, sem passar por arquivo:
#
#      oc create secret generic ia0001-ioerj-rag-diario-secret \
#        --from-literal=ANTHROPIC_API_KEY='...' \
#        --from-literal=AZURE_FOUNDRY_ENDPOINT='https://...' \
#        --from-literal=ORACLE_USER='...' \
#        --from-literal=ORACLE_PASSWORD='...' \
#        --from-literal=ORACLE_DSN='jdbc:oracle:thin:@//host:1521/SERVICE' \
#        --from-literal=EMAIL_API_URL='https://.../api/v1/email/enviar' \
#        --from-literal=AUTORIZADOR_TOKEN='...'
#
#  Se o cluster tiver Sealed Secrets ou o Vault da SEFAZ, prefira esse caminho -
#  e o unico jeito de o Secret conviver com GitOps sem vazar.
# ==========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: ia0001-ioerj-rag-diario-secret
  labels:
    app: ia0001-ioerj-rag-diario
type: Opaque
stringData:
  # --- IA ------------------------------------------------------------------
  # Chave da Anthropic OU da Azure/Foundry (neste caso preencha o endpoint
  # abaixo e o RAG_MODEL do ConfigMap vira o nome do DEPLOYMENT).
  ANTHROPIC_API_KEY: ""
  # Vazio = Anthropic direta. Preenchido = Claude na Azure/Microsoft Foundry.
  AZURE_FOUNDRY_ENDPOINT: ""

  # --- Oracle --------------------------------------------------------------
  # USE UMA CONTA DE SERVICO. Com credencial pessoal o job para quando a senha
  # expira, e toda gravacao fica registrada no nome da pessoa - o proprio
  # .env.example do projeto ja alerta para isso.
  # O DSN aceita Easy Connect (host:1521/SERVICE) ou colado de uma URL JDBC.
  ORACLE_USER: ""
  ORACLE_PASSWORD: ""
  ORACLE_DSN: ""

  # --- E-mail --------------------------------------------------------------
  # O endpoint da API corporativa de e-mail (o apps.email.url do lado Java).
  EMAIL_API_URL: ""
  # ATENCAO, SAO DOIS TOKENS. Este e a credencial de ENTRADA do autorizador
  # (tipoToken: AUTH). A API de e-mail NAO aceita este token - responde 403 de
  # corpo vazio. O token que ela aceita e o que o autorizador devolve, e quem
  # faz essa troca a cada envio e o proprio codigo (src/enviar_email.py).
  AUTORIZADOR_TOKEN: ""
